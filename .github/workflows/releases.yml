name: Build Cross Toolchain Release

on:
  push:
    tags:
      - 'require_buildutils*'

permissions:
  contents: write

env:
  BINUTILS_VERSION: '2.47'
  GCC_VERSION: '16.2.0'
  TARGET: 'i686-elf'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: i686-elf-tools-linux-x86_64.tar.gz
          - os: macos-latest
            artifact_name: i686-elf-tools-macos-arm64.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          export TZ=Etc/UTC
          sudo apt-get update && sudo apt-get install -y \
            build-essential bison flex libgmp-dev libmpfr-dev libmpc-dev texinfo wget curl tar

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install gmp mpfr libmpc texinfo bison flex wget

      - name: Download & Extract Source
        run: |
          wget -q https://gnu.org{BINUTILS_VERSION}.tar.xz
          wget -q https://gnu.org{GCC_VERSION}/gcc-${GCC_VERSION}.tar.xz
          tar -xf binutils-${BINUTILS_VERSION}.tar.xz
          tar -xf gcc-${GCC_VERSION}.tar.xz

      - name: Prepare install prefix
        run: |
          sudo mkdir -p /opt/${TARGET}
          sudo chown -R $(whoami) /opt/${TARGET}

      - name: Build Binutils
        run: |
          mkdir build-binutils && cd build-binutils
          if [ "$RUNNER_OS" == "Linux" ]; then
            JOBS=$(nproc)
          else
            JOBS=$(sysctl -n hw.ncpu)
          fi

          ../binutils-${BINUTILS_VERSION}/configure \
            --target=${TARGET} \
            --prefix=/opt/${TARGET} \
            --disable-nls \
            --disable-werror
          make -j${JOBS}
          make install

      - name: Build GCC
        run: |
          mkdir build-gcc && cd build-gcc
          export PATH="/opt/${TARGET}/bin:$PATH"

          if [ "$RUNNER_OS" == "Linux" ]; then
            JOBS=$(nproc)
            EXTRA_ARGS=""
          else
            JOBS=$(sysctl -n hw.ncpu)
            BREW_PREFIX=$(brew --prefix)
            EXTRA_ARGS="--with-gmp=${BREW_PREFIX} --with-mpfr=${BREW_PREFIX} --with-mpc=${BREW_PREFIX}"
          fi

          ../gcc-${GCC_VERSION}/configure \
            --target=${TARGET} \
            --prefix=/opt/${TARGET} \
            --disable-nls \
            --enable-languages=c,c++ \
            --without-headers \
            --with-static-standard-libraries \
            ${EXTRA_ARGS}

          make all-gcc -j${JOBS}
          make all-target-libgcc -j${JOBS}
          make install-gcc
          make install-target-libgcc

      - name: Pack Toolchain
        run: |
          tar -czf ${{ matrix.artifact_name }} -C /opt ${TARGET}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
